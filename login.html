<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Sign In - CloudAttend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="brand-text" style="text-align: left;">
          <span class="brand-title">CloudAttend</span>
          <span class="brand-subtitle">Teacher Portal</span>
        </div>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to manage your classes and attendance</p>
    </div>

    <!-- Error/Notice Alert Box -->
    <div id="auth-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 0.875rem;"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address <span class="required">*</span></label>
        <div class="input-icon-group">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="login-email" class="form-control" placeholder="teacher@school.edu" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="login-password" class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
        </div>
        <div class="input-icon-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
        <span id="btn-login-text"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account</span>
        <span id="btn-login-spinner" style="display: none;" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have a teacher account yet?
      <a href="register.html" style="font-weight: 600;">Register here</a>
    </div>

    <div style="margin-top: 18px; text-align: center;">
      <a href="index.html" class="text-secondary" style="font-size: 0.8rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script type="module">
    import { loginTeacher, onAuthStateChange } from './js/auth.js';
    import { showToast, showAlert } from './js/utils.js';

    // Auto redirect if already signed in
    onAuthStateChange((user) => {
      if (user) {
        window.location.replace('dashboard.html');
      }
    });

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('btn-login-submit');
    const btnText = document.getElementById('btn-login-text');
    const btnSpinner = document.getElementById('btn-login-spinner');
    const alertBox = document.getElementById('auth-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert(alertBox, 'Please enter both your email address and password.', 'danger');
        return;
      }

      // Show loading
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        await loginTeacher(email, password);
        showToast('Signed in successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.replace('dashboard.html');
        }, 600);
      } catch (err) {
        submitBtn.disabled = false;
        btnText.style.display = 'inline-flex';
        btnSpinner.style.display = 'none';

        let userMsg = err.message || 'Failed to sign in. Please check your credentials.';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          userMsg = 'Incorrect email or password. Please verify your credentials.';
        } else if (err.code === 'auth/invalid-email') {
          userMsg = 'Please enter a valid email address.';
        } else if (err.code === 'auth/too-many-requests') {
          userMsg = 'Access temporarily disabled due to many failed attempts. Try again later or reset password.';
        }
        showAlert(alertBox, userMsg, 'danger');
      }
    });
  </script>
</body>
</html>
